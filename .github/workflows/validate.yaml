name: validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: policies
    steps:
      - uses: actions/checkout@v4

      - name: Set up OPA
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: 1.19.1

      - name: Format
        run: opa fmt --fail -l .

      - name: Check
        run: opa check --strict .

      - name: Test
        run: opa test -v --coverage .
