name: validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: policies
    steps:
      - uses: actions/checkout@v4

      - name: Set up OPA
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: 1.19.1

      - name: Format
        run: opa fmt --fail -l .

      - name: Check
        run: opa check --strict .

      - name: Test
        run: opa test -v --coverage .

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Regal
        uses: open-policy-agent/setup-regal@761188c3b435761fa254beca508a44875619648f # v2.0.0
        with:
          version: 0.42.0

      - name: Regal lint (SARIF)
        run: regal lint --format sarif . > regal.sarif
        continue-on-error: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        if: always()
        with:
          sarif_file: regal.sarif
          category: regal

      - name: Fail on lint errors
        run: regal lint --no-color --format github .
